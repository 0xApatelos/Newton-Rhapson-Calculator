name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    name: Compile and run tests (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '21' ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Compile application sources
        run: |
          mkdir -p build/classes
          javac -d build/classes src/FinalProject/*.java

      - name: Compile test sources
        run: |
          mkdir -p build/test-classes
          javac -cp build/classes -d build/test-classes test/FinalProject/*.java

      - name: Run test suite
        run: |
          java -cp build/classes:build/test-classes FinalProject.NewtonSolverTest
